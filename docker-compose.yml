version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codequest-db
    environment:
      POSTGRES_USER: codequest
      POSTGRES_PASSWORD: codequest123
      POSTGRES_DB: codequest
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codequest"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codequest-api
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://codequest:codequest123@postgres:5432/codequest
      JWT_SECRET: dev_jwt_secret_key_change_in_production
      OPENAI_API_KEY: ${OPENAI_API_KEY:-sk-test-key}
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codequest-web
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
      REACT_APP_ENV: development
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm start

volumes:
  postgres_data:
